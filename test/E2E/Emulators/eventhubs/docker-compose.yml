name: powershell-worker-e2e

services:
  eventhubs:
    container_name: powershell-worker-eventhubs-emulator
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    volumes:
      - ./config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: Y
    depends_on:
      - azurite
    networks:
      e2e:
        aliases:
          - eventhubs-emulator

  azurite:
    container_name: powershell-worker-azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      e2e:
        aliases:
          - azurite

networks:
  e2e:

